# Tofi IPTV — Nginx ters proxy yapılandırması
#
# Bu dosyayı /etc/nginx/sites-available/tofi-iptv olarak kopyalayın ve
# /etc/nginx/sites-enabled/ dizininden sembolik bağlantı oluşturun:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/tofi-iptv
#   sudo ln -s /etc/nginx/sites-available/tofi-iptv /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream tofi_app {
    # Next.js uygulaması 3000. portta dinliyor; dışarıya açılmıyor.
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;    # Sunucu adını buraya yazın: örn. iptv.ornek.com

    # ─── Yayın proxy uç noktası ───────────────────────────────────────────────
    #
    # Bu bloktaki ayarların KALDIRILMAMASI GEREKİR.
    # Her biri belirli bir yayın sorununu çözmektedir; açıklamalar okuyun.
    #
    location /api/stream {
        proxy_pass http://tofi_app;

        # ZORUNLU: Nginx varsayılan olarak upstream yanıtını bellekte/diskte
        # tamponlar, sonra istemciye gönderir. Canlı yayın için bu ölümcüldür:
        # tampon dolana kadar istemci hiçbir veri almaz → oynatıcı takılır.
        # Bu ayar kapatılırsa her kanal değişiminde siyah ekran görürsünüz.
        proxy_buffering off;

        # ZORUNLU: İstemci isteği de tamponlanmamalı. Büyük bir POST/PUT gövdesi
        # olsaydı varsayılan tamponlama sıraya alırdı; akış bağlantıları için
        # bu gecikmeyi de kaldırıyoruz.
        proxy_request_buffering off;

        # ZORUNLU: Canlı yayın saatlerce sürebilir. Nginx'in varsayılan okuma
        # zaman aşımı 60 saniyedir; bu değerle aktif bir yayın 60 saniye veri
        # gelmeyen her sessiz anda kesilir. 24 saate çekiyoruz.
        proxy_read_timeout 24h;

        # ZORUNLU: HTTP/1.1 ile upstream bağlantısı kalıcı tutulur (keepalive).
        # HTTP/1.0 her istekte yeni TCP el sıkışması açar; canlı yayında
        # akışı parçalar ve gecikme yaratır.
        proxy_http_version 1.1;

        # Upstream bağlantısını canlı tutmak için keepalive başlığını temizle.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Uygulama (genel rotalar) ─────────────────────────────────────────────
    location / {
        proxy_pass http://tofi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Genel uç noktalar için 60 s yeterlidir; 40 MB playlist indirmesi bu
        # süre içinde biter. /api/stream ayrı blokta ele alındığından bu değer
        # oraya uygulanmaz.
        proxy_read_timeout 60s;
    }
}
